<div class="app">
  <header class="mast">
    <h1>Buenos Aires</h1>
    <p class="standfirst" id="count">114 lugares que o Gui salvou, da parrilla ao café.</p>
    <input class="search" id="q" type="search" name="q" placeholder="Buscar lugar, bairro ou nota" aria-label="Buscar lugar, bairro ou nota" autocomplete="off" inputmode="search">

  </aside>
  <main class="map" id="map">
    <canvas id="cv" aria-label="Mapa de Buenos Aires com ruas, parques, subte e os lugares salvos"></canvas>
    <div class="pins" id="pins"></div>
    <div class="ctl">
      <button type="button" id="zin" aria-label="Aproximar">+</button>
      <button type="button" id="zout" aria-label="Afastar">−</button>
      <button type="button" id="fit">Ver todos</button>
    </div>
    <div class="status" id="status" role="status"><p>Carregando o mapa</p></div>
    <article class="card" id="card" hidden></article>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
{
const DATA = JSON.parse(document.getElementById('data').textContent);
let CATS = DATA.categorias, NOME = Object.fromEntries(CATS);
let L = DATA.lugares;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
const URLRE = /https?:\/\/\S+/g;
const lento = matchMedia('(prefers-reduced-motion: reduce)').matches;
const preparar = () => L.forEach(l => {
  const urls = (l.no || '').match(URLRE) || [];
  l.ig = l.post || urls.find(u => u.includes('instagram.com')) || urls[0] || '';
  l.txt = (l.no || '').replace(URLRE, '').replace(/\s+/g, ' ').replace(/[:\s]+$/, '').trim();
  l.cat = NOME[l.e] || 'Outros';
  l.busca = norm([l.n, l.txt, l.d, l.b, l.t, l.cat, l.rs].join(' '));
});
preparar();
const inicial = l => esc(l.n.replace(/^[^\p{L}\p{N}]+/u, '').charAt(0).toUpperCase());

/* ---------- estado ---------- */
let sel = new Set(), q = '', cur = null;
try { JSON.parse(localStorage.getItem('mapaba.sel') || '[]').forEach(e => NOME[e] && sel.add(e)); } catch (e) {}
const salvar = () => { try { localStorage.setItem('mapaba.sel', JSON.stringify([...sel])); } catch (e) {} };
const ok = l => (sel.size === 0 || sel.has(l.e)) && (!q || l.busca.includes(q));
const visiveis = () => L.filter(ok);

/* ---------- categorias e lista ---------- */
const catsEl = document.getElementById('cats'), listEl = document.getElementById('list'), countEl = document.getElementById('count');
let total = {};
function renderCats() {
  total = {}; L.forEach(l => total[l.e] = (total[l.e] || 0) + 1);
  catsEl.innerHTML = `<button type="button" class="cell" data-e="" aria-pressed="${sel.size === 0}">Todos <span class="n">${L.length}</span></button>` +
    CATS.filter(([e]) => total[e]).map(([e, n]) => `<button type="button" class="cell" data-e="${e}" aria-pressed="${sel.has(e)}">${esc(n)} <span class="n">${total[e]}</span></button>`).join('');
}
function renderList() {
  const vis = visiveis();
  countEl.textContent = vis.length === L.length ? `${L.length} lugares que o Gui salvou, da parrilla ao café.` : `${vis.length} de ${L.length} lugares nesta seleção.`;
  if (!vis.length) {
    listEl.innerHTML = `<div class="empty"><p>Nenhum lugar com essa busca ou filtro.</p><button type="button" class="btn" id="limpar">Limpar filtros</button></div>`;
    return;
  }
  const grupos = CATS.map(([e, n]) => [e, n, vis.filter(l => l.e === e).sort((a, b) => a.n.localeCompare(b.n, 'es'))]).filter(g => g[2].length);
  listEl.innerHTML = grupos.map(([e, n, ls]) => `<section class="grp"><div class="gh"><h2>${esc(n)}</h2><span class="n">${ls.length}</span></div>` +
    ls.map(l => `<button type="button" class="row${cur === l ? ' on' : ''}" data-id="${l.id}">` +
      (l.f ? `<img class="thumb" src="mini/${l.id}.webp" width="64" height="64" loading="lazy" alt="">` : `<span class="thumb thumb--vazio" aria-hidden="true">${inicial(l)}</span>`) +
      `<span><b>${esc(l.n)}</b><span class="m"><span>${esc(l.b)}</span>${l.p ? `<span>${esc(l.p)}</span>` : ''}</span>${(l.d || l.txt) ? `<span class="nt">${esc(l.d || l.txt)}</span>` : ''}</span></button>`).join('') + `</section>`).join('');
}
catsEl.addEventListener('click', ev => {
  const b = ev.target.closest('.cell'); if (!b) return;
  const e = b.dataset.e;
  if (!e) sel.clear(); else sel.has(e) ? sel.delete(e) : sel.add(e);
  salvar(); atualizar(true);
});
listEl.addEventListener('click', ev => {
  if (ev.target.closest('#limpar')) { sel.clear(); q = ''; qEl.value = ''; salvar(); atualizar(true); return; }
  const r = ev.target.closest('.row'); if (r) abrir(L.find(l => l.id === r.dataset.id), true);
});
const qEl = document.getElementById('q');
qEl.addEventListener('input', () => { q = norm(qEl.value.trim()); atualizar(false); });

/* ---------- mapa ---------- */
const box = document.getElementById('map'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const pinsEl = document.getElementById('pins'), statusEl = document.getElementById('status');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let M = null, P = null, cor = {}, t = d3.zoomIdentity, k0 = 1, W = 2387, H = 2200, dpr = 1, agendado = false;
let pinEls = new Map();
function construirPins() {
  pinsEl.innerHTML = [...L].sort((a, b) => a.y - b.y).map(l => `<button type="button" class="pin" data-id="${l.id}" aria-label="${esc(l.n)}, ${esc(l.cat)}" title="${esc(l.n)}">` +
  (l.f ? `<img src="mini/${l.id}.webp" width="64" height="64" loading="lazy" alt="">` : `<span class="ini">${inicial(l)}</span>`) + `</button>`).join('');
  pinEls = new Map([...pinsEl.children].map(b => [b.dataset.id, b]));
}
construirPins();
pinsEl.addEventListener('click', ev => { const b = ev.target.closest('.pin'); if (b) { ev.stopPropagation(); abrir(L.find(l => l.id === b.dataset.id), false); } });

function lerCores() {
  ['--map-outside', '--map-land', '--map-water', '--map-park', '--map-local', '--map-compl', '--map-princ', '--map-tronc', '--map-label', '--map-label-2', '--map-rail', '--map-water-label', '--map-park-label', '--map-halo', '--color-ink', '--color-paper']
    .forEach(n => cor[n] = css(n));
  ['a', 'b', 'c', 'd', 'e', 'h'].forEach(k => cor[k.toUpperCase()] = css('--line-' + k));
}
function caminhos(m) {
  const Q = m.Q, trilha = (arr, fechar) => { const p = new Path2D(); for (const a of arr) { let x = a[0], y = a[1]; p.moveTo(x / Q, y / Q); for (let i = 2; i < a.length; i += 2) { x += a[i]; y += a[i + 1]; p.lineTo(x / Q, y / Q); } if (fechar) p.closePath(); } return p; };
  const barr = new Path2D(); m.barrios.forEach(b => barr.addPath(new Path2D(b.d)));
  return {
    rio: new Path2D(m.rio), cidade: new Path2D(m.contorno), lagos: new Path2D(m.lagos), barrios: barr,
    parques: trilha(m.parques, true), aguas: trilha(m.aguas || [], true), trens: trilha(m.trens || []), ruas: Object.fromEntries(Object.entries(m.ruas).map(([k, v]) => [k, trilha(v)])),
    subte: Object.fromEntries(Object.entries(m.subte.linhas).map(([k, v]) => [k, trilha(v)])),
  };
}
const rampa = (k, a, b) => Math.max(0, Math.min(1, (k / k0 - a) / (b - a)));
const SERIF = '"Source Serif 4", Georgia, serif', DISP = '"Bricolage Grotesque", sans-serif';
/* Desenho em duas camadas: o mapa completo é pintado numa "foto" (com margem em volta) só quando
   o gesto para; durante o arrasto/zoom, só essa foto é reposicionada e escalada — custa ~1 ms por quadro. */
const snap = document.createElement('canvas'), sctx = snap.getContext('2d');
let tSnap = null, sujo = true, ocioso = 0;
const MARG = 0.35;
const larguraTexto = new Map();
function pintar(ctx, t, cw, ch) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = cor['--map-outside']; ctx.fillRect(0, 0, cw * dpr, ch * dpr);
  if (!P) return;
  const k = t.k, s = dpr * k;
  ctx.setTransform(s, 0, 0, s, dpr * t.x, dpr * t.y);
  ctx.fillStyle = cor['--map-water']; ctx.fill(P.rio);
  ctx.fillStyle = cor['--map-land']; ctx.fill(P.cidade);
  ctx.fillStyle = cor['--map-water']; ctx.fill(P.lagos);
  ctx.fillStyle = cor['--map-park']; ctx.fill(P.parques);
  ctx.fillStyle = cor['--map-water']; ctx.fill(P.aguas);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const traco = (path, c, px, alpha = 1) => { if (alpha <= 0 || !path) return; ctx.globalAlpha = alpha; ctx.strokeStyle = c; ctx.lineWidth = px / k; ctx.stroke(path); ctx.globalAlpha = 1; };
  traco(P.ruas.local, cor['--map-local'], 0.9, rampa(k, 1.8, 3.2));
  traco(P.ruas.peat, cor['--map-local'], 0.9, rampa(k, 2.5, 4));
  traco(P.ruas.compl, cor['--map-compl'], 0.9, rampa(k, 1.1, 2));
  traco(P.ruas.princ, cor['--map-princ'], 1);
  traco(P.ruas.tronc, cor['--map-tronc'], 1.5);
  traco(P.ruas.auto, cor['--map-tronc'], 2.2);
  traco(P.trens, cor['--map-rail'], 1.2, rampa(k, 0.9, 1.6));
  traco(P.barrios, cor['--map-compl'], 1.2, 0.9 - rampa(k, 3, 5) * 0.6);
  for (const [lin, path] of Object.entries(P.subte)) traco(path, cor[lin] || cor['--color-ink'], 3);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ocupado = [], livre = r => !ocupado.some(o => r.x < o.x + o.w && r.x + r.w > o.x && r.y < o.y + o.h && r.y + r.h > o.y);
  const rotulo = (txt, x, y, ang, fonte, c) => {
    ctx.font = fonte; const ch_ = fonte + '|' + txt; let wd = larguraTexto.get(ch_);
    if (wd === undefined) { wd = ctx.measureText(txt).width; larguraTexto.set(ch_, wd); }

  for (let i = 0; i < txt.length; i++) {

    if (aspas) { if (c === '"') { if (txt[i + 1] === '"') { campo += '"'; i++; } else aspas = false; } else campo += c; }
    else if (c === '"') aspas = true;

    else if (c === '\n') { linha.push(campo); linhas.push(linha); linha = []; campo = ''; }

}
